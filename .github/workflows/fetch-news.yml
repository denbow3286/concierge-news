name: Fetch Notion News

on:
  workflow_dispatch:
  schedule:
    # 日本時間(JST)の AM 5:30 と PM 17:30 に実行
    # ※GitHubのサーバーはUTC（協定世界時）なので、日本時間からマイナス9時間して設定します
    - cron: '30 20 * * *'  # 日本時間の 朝 5:30
    - cron: '30 8 * * *'   # 日本時間の 夕方 17:30

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fetch-and-save:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Fetch data from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: python fetch_news.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add news.json
          git diff --cached --quiet || (git commit -m "Update news.json from Notion" && git push)
