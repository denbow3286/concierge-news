name: Fetch Notion News

on:
  workflow_dispatch:
  schedule:
    # 日本時間(JST)の AM 1:30 と PM 13:30 に実行
    # ※MAKEの実行(1:07 / 13:07)完了を待ってから確実に動かします
    # ※GitHub側はマイナス9時間のUTC(協定世界時)で指定します
    - cron: '30 16 * * *'  # 日本時間の 午前 1:30
    - cron: '30 4 * * *'   # 日本時間の 午後 13:30

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fetch-and-save:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Fetch data from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: python fetch_news.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add news.json
          git diff --cached --quiet || (git commit -m "Update news.json from Notion" && git push)
