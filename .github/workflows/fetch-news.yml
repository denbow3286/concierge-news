name: Fetch Notion News

on:
  workflow_dispatch: # 手動で動かせるようにする設定

# ↓↓↓ 今回追加した部分：ロボットにリポジトリへの書き込み（Push）権限を与えます ↓↓↓
permissions:
  contents: write
# ↑↑↑ ここまで ↑↑↑

jobs:
  fetch-and-save:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch data from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: python fetch_news.py # 先ほど作ったプログラムを実行します！

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add news.json
          git diff --cached --quiet || (git commit -m "Update news.json from Notion" && git push)
